[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wordtally"
version = "0.1.0"
description = "Print the most frequent words of a text."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wordtally = "wordtally.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
