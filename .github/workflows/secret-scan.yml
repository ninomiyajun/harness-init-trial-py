# 秘匿値（API の鍵、トークンなど）の混入の検査。gitleaks で履歴の全体を調べ、検出があるとジョブが失敗する。
# マージの必須条件にする設定は、GitHub のリポジトリの設定（ブランチの保護）で行う。
# サードパーティのアクションは使わず、公式のリリースのバイナリを、書いた SHA-256 と照合してから実行する。
# gitleaks の版を上げるときは、GITLEAKS_VERSION と GITLEAKS_SHA256 を同時に変える
# （値は、リリースの gitleaks_<版>_checksums.txt の linux_x64 の行）。
name: secret-scan

# push は、すべてのブランチとタグで動かす
on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    # ブランチやタグを消した push では、検査する中身が無い
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # 履歴の全体を調べるため、fetch-depth を 0 にする
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks の取得と SHA-256 の照合
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 -o "${RUNNER_TEMP}/gitleaks/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          # 照合に失敗すると、ここでジョブが失敗する
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
      - name: gitleaks（秘匿値の混入の検査）
        # --redact で、検出した秘匿値そのものをログに出さない。検出があると終了コードが 0 以外になる
        run: |
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --verbose
